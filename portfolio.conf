map $http_user_agent $bad_bot {
default 0;
~*zgrab 1;
~*masscan 1;
~*nmap 1;
~*nikto 1;
~*sqlmap 1;
~*python-requests 1;
~*libwww-perl 1;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    
    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    server_name _; 
    return 444; 
}

server {
    listen 80;
    listen [::]:80;
    server_name mayradev.me www.mayradev.me;
    return 301 https://$host$request_uri;
}

server { 
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mayradev.me www.mayradev.me;

     if ($bad_bot) {
        return 403;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (wp-includes|wp-admin|wp-content|wp-login\.php|xmlrpc\.php) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /nginx.conf {
    deny all;
    }

    location ~* /\.well-known/acme-challenge/.*\.php {
    deny all;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
    }

    location ~* \.(php|cgi|pl|py|env|yml|ini|bak|sql|tar|gz|zip|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/portfolio_access.log minimal;
    error_log  /var/log/nginx/portfolio_error.log warn;

    include /etc/nginx/snippets/security.conf;
    include /etc/nginx/snippets/csp_portfolio.conf;

    # Pegar todos os arquivos hash do vite
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable"; 
        access_log off;
        include /etc/nginx/snippets/security.conf;
        include /etc/nginx/snippets/csp_portfolio.conf;
    }

    # Cache das imagens
    location ~* \.(?:ico|png|jpg|jpeg|svg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        include /etc/nginx/snippets/security.conf;
        include /etc/nginx/snippets/csp_portfolio.conf;
    }

    location / {
        limit_except GET HEAD { 
            deny all; 
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security.conf;
        include /etc/nginx/snippets/csp_portfolio.conf;
    }
}